<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NIGHTON | 조판·정산 운영 OS</title>
<meta name="theme-color" content="#050810">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/nighton-v2.css">
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="brand">NIGHT<b>ON</b></div>
    <p class="subtitle">조판 · 자동정산 · 직원관리</p>
    <input id="email" class="field" type="email" placeholder="이메일">
    <input id="password" class="field" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
    <button class="btn primary" onclick="login()">로그인</button>
    <button class="btn ghost" onclick="enterDemo()">체험으로 들어가기</button>
    <div id="loginError" class="error"></div>
    <div class="hint">실제 운영 데이터는 승인된 회원만 접근할 수 있습니다.<br>체험 모드는 실제 데이터에 영향을 주지 않습니다.</div>
  </div>
</section>

<section id="app" class="shell hidden">
  <header class="topbar">
    <div class="topin">
      <div class="brand">NIGHT<b>ON</b></div>
      <span id="demoBadge" class="demo-badge hidden">체험모드</span>
      <div class="spacer"></div>
      <div class="topstat">영업일 <strong id="bizDate"></strong></div>
      <div class="topstat">오늘 매출 <strong id="topSales">0원</strong></div>
      <button class="btn ghost" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <button class="navbtn active">오늘 조판</button>
      <button class="navbtn">예약</button>
      <button class="navbtn">고객</button>
      <button class="navbtn">직원</button>
      <button class="navbtn">매출·정산</button>
      <button class="navbtn">문자</button>
      <button class="navbtn">통계</button>
      <button class="navbtn">설정</button>
    </aside>

    <main class="main">
      <div class="kpis">
        <div class="kpi"><span>오늘 총매출</span><strong id="kpiSales">0원</strong></div>
        <div class="kpi"><span>진행 조판</span><strong id="kpiBoards">0건</strong></div>
        <div class="kpi"><span>현재 손님</span><strong id="kpiGuests">0명</strong></div>
        <div class="kpi"><span>미수금</span><strong id="kpiRecv">0원</strong></div>
      </div>

      <div class="section-head">
        <div>
          <h1>오늘 조판</h1>
          <p>손님 입장부터 연장·추가·계산까지 한 화면에서 처리합니다.</p>
        </div>
        <div class="spacer"></div>
        <button class="btn primary" onclick="openNew()">+ 새 조판</button>
      </div>

      <div class="tablewrap">
        <table class="board-table">
          <thead>
            <tr><th>입장</th><th>손님</th><th>담당</th><th>상태</th><th>총금액</th><th>직원지급</th><th>마진</th><th>결제</th></tr>
          </thead>
          <tbody id="boardRows"></tbody>
        </table>
      </div>

      <div id="mobileCards" class="mobilecards"></div>
    </main>

    <aside class="right">
      <div class="card">
        <h3>빠른 메뉴</h3>
        <div class="quick">
          <button class="btn primary" onclick="openNew()">새 조판</button>
          <button class="btn ghost" onclick="closeDay()">오늘 마감</button>
        </div>
      </div>

      <div class="card">
        <h3>직원 현황</h3>
        <div id="empList"></div>
      </div>
    </aside>
  </div>

  <button class="fab" onclick="openNew()">＋</button>

  <nav class="mobilebar">
    <button class="active">조판</button>
    <button>예약</button>
    <button>고객</button>
    <button>정산</button>
    <button>더보기</button>
  </nav>
</section>

<div id="newModal" class="modal hidden">
  <div class="sheet">
    <h2>새 조판</h2>
    <label class="label">손님명 / 별칭</label>
    <input id="customerName" class="field" placeholder="예: 김민수">
    <label class="label">전화번호</label>
    <input id="customerPhone" class="field" inputmode="tel" placeholder="선택 입력">
    <label class="label">인원</label>
    <input id="guestCount" class="field" type="number" min="1" value="1">

    <label class="label">담당 직원</label>
    <div id="employeeChoices" class="choices"></div>

    <label class="label">기본 코스</label>
    <div id="productChoices" class="choices"></div>

    <div class="sheet-actions">
      <button class="btn ghost" onclick="closeModal('newModal')">취소</button>
      <button class="btn primary" onclick="createBoard()">조판 시작</button>
    </div>
  </div>
</div>

<div id="detailModal" class="modal hidden">
  <div class="sheet">
    <h2 id="detailTitle">조판 상세</h2>
    <div id="detailInfo"></div>
    <label class="label">메뉴 / 연장 추가</label>
    <div id="detailProducts" class="choices"></div>
    <div class="sheet-actions">
      <button class="btn ghost" onclick="closeModal('detailModal')">닫기</button>
      <button class="btn gold" onclick="closeModal('detailModal');payBoard(currentBoard.id)">계산하기</button>
    </div>
  </div>
</div>

<div id="payModal" class="modal hidden">
  <div class="sheet">
    <h2>결제</h2>
    <div class="card">
      <h3>총 결제금액</h3>
      <strong id="payAmount" style="font-size:28px">0원</strong>
    </div>
    <div class="choices">
      <button class="choice" onclick="confirmPay('cash')">현금</button>
      <button class="choice" onclick="confirmPay('card')">카드</button>
      <button class="choice" onclick="confirmPay('transfer')">계좌</button>
      <button class="choice" onclick="confirmPay('receivable','receivable')">미수</button>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" onclick="closeModal('payModal')">취소</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/nighton-v2.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{const e=document.getElementById('bizDate');if(e)e.textContent=businessDate()})</script>
</body>
</html>
