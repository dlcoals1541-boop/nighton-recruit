name: NIGHTON one-time hero CTA responsive fix

on:
  push:
    paths:
      - '.github/workflows/nighton-hero-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch hero CTA layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* ===== NIGHTON hero CTA responsive fix v1 ===== */'
          if marker in text:
              raise SystemExit('Hero fix already present; nothing to do.')

          css = r'''
          <style>
          /* ===== NIGHTON hero CTA responsive fix v1 ===== */
          .hero.hero-chat-first{padding:0}
          .hero-visual-stage{
            position:relative;
            width:min(100%,1080px);
            margin:0 auto;
            height:clamp(600px,calc(100svh - 98px),680px);
            min-height:600px;
            max-height:680px;
            overflow:hidden
          }
          .hero-visual-stage::after{
            content:"";
            position:absolute;
            z-index:2;
            left:0;
            right:0;
            bottom:0;
            height:42%;
            pointer-events:none;
            background:linear-gradient(to bottom,rgba(5,9,18,0) 0%,rgba(5,9,18,.18) 38%,rgba(5,9,18,.68) 72%,rgba(5,9,18,.94) 100%)
          }
          .hero-background{
            width:100%;
            height:100%;
            object-fit:contain;
            object-position:center
          }
          .hero-overlay-content{
            position:absolute;
            z-index:4;
            left:50%;
            right:auto;
            bottom:30px;
            transform:translateX(-50%);
            width:clamp(420px,50%,560px);
            text-align:center
          }
          .hero-overlay-content::before{display:none}
          .hero-action-note{
            margin:0 0 12px;
            text-align:center;
            color:rgba(255,255,255,.92);
            font-size:15px;
            line-height:1.5;
            font-weight:600;
            text-shadow:0 2px 14px rgba(0,0,0,.65)
          }
          .condition-primary{
            width:100%;
            min-height:56px;
            border-radius:14px;
            font-size:16px;
            transition:transform .18s ease,box-shadow .18s ease
          }
          .condition-primary:hover{
            transform:translateY(-1px);
            box-shadow:0 14px 30px rgba(217,164,83,.24)
          }
          .condition-secondary{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:18px;
            margin-top:11px
          }
          .condition-secondary a{
            color:rgba(255,255,255,.88);
            font-size:12px;
            font-weight:800;
            text-decoration:none;
            transition:color .18s ease,opacity .18s ease
          }
          .condition-secondary a:hover{color:#f1cf8d}

          @media (min-width:821px) and (max-width:1100px){
            .hero-visual-stage{
              width:min(92vw,960px);
              height:clamp(600px,70vh,680px)
            }
            .hero-overlay-content{
              width:clamp(420px,54%,540px);
              bottom:28px
            }
          }

          @media (max-width:820px){
            .hero-visual-stage{
              width:100%;
              margin:0;
              height:auto;
              min-height:0;
              max-height:none;
              aspect-ratio:1122/1402
            }
            .hero-visual-stage::before{display:none}
            .hero-visual-stage::after{
              height:40%;
              background:linear-gradient(to bottom,rgba(5,9,18,0) 0%,rgba(5,9,18,.16) 35%,rgba(5,9,18,.72) 70%,rgba(5,9,18,.94) 100%)
            }
            .hero-background{
              object-fit:contain;
              object-position:center
            }
            .hero-overlay-content{
              left:16px;
              right:16px;
              bottom:18px;
              width:auto;
              transform:none
            }
            .hero-action-note{
              margin-bottom:9px;
              font-size:13px
            }
            .condition-primary{
              min-height:52px;
              font-size:15px
            }
            .condition-secondary{
              gap:14px;
              margin-top:9px
            }
            .condition-secondary a{font-size:12px}
          }

          @media (max-width:430px){
            .hero-overlay-content{
              left:14px;
              right:14px;
              bottom:14px
            }
            .hero-action-note{font-size:12px}
            .condition-primary{
              min-height:51px;
              font-size:14px
            }
            .condition-secondary{gap:12px}
            .condition-secondary a{font-size:11px}
          }
          </style>
          '''

          if '</head>' not in text:
              raise SystemExit('Could not find </head> in index.html')

          text = text.replace('</head>', css + '\n</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit responsive hero fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix responsive hero CTA placement"
          git push
