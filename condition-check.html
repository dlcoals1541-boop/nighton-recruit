<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17100c">
<meta name="robots" content="noindex,follow">
<title>내 조건 알아보기 | NIGHTON</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0907;--panel:#18110d;--panel2:#211710;--line:rgba(240,206,139,.2);--gold:#d5a85f;--gold2:#f0ce8b;--cream:#fff7ec;--muted:#ad9e92;--danger:#ffb4b4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 80% 0,rgba(213,168,95,.12),transparent 34%),var(--bg);color:var(--cream);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}button,a{font:inherit}.shell{width:min(100% - 28px,620px);margin:auto;padding:22px 0 max(30px,env(safe-area-inset-bottom))}.brand{display:inline-block;color:var(--gold2);font-family:Georgia,serif;font-weight:900;letter-spacing:.15em;text-decoration:none;margin-bottom:26px}.panel{background:rgba(24,17,13,.96);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.32)}.progress-head{display:flex;justify-content:space-between;gap:16px;color:#d8c5ae;font-size:12px;font-weight:800}.track{height:7px;background:#2b211a;border-radius:99px;margin:10px 0 28px;overflow:hidden}.bar{height:100%;width:16.666%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .25s ease}.kicker{font-size:11px;color:var(--gold2);font-weight:900;letter-spacing:.12em}.question{font-size:clamp(25px,6.7vw,34px);line-height:1.25;margin:9px 0 8px;word-break:keep-all}.hint{min-height:22px;color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:18px}.options{display:grid;gap:10px}.option{width:100%;min-height:54px;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:#201711;color:#f7ebdc;text-align:left;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}.option:hover{border-color:rgba(240,206,139,.52)}.option[aria-pressed="true"]{border-color:var(--gold2);background:#332417;box-shadow:inset 0 0 0 1px rgba(240,206,139,.2)}.option[aria-pressed="true"]:after{content:"✓";color:var(--gold2)}.actions{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:24px}.btn{min-height:50px;border:0;border-radius:13px;padding:0 18px;font-weight:900;cursor:pointer}.back{background:#28201a;color:#d8cabe;border:1px solid var(--line)}.next,.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#24160d}.btn:disabled{opacity:.45;cursor:not-allowed}.error{color:var(--danger);font-size:13px;line-height:1.5;min-height:20px;margin-top:12px}.blocked{text-align:center}.blocked h1,.result h1{font-size:30px;margin:8px 0 12px}.blocked p,.result>p{color:var(--muted);line-height:1.7}.summary{display:grid;gap:9px;margin:22px 0}.summary-row{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.summary-row span{color:var(--muted);font-size:12px}.summary-row strong{font-size:14px}.guides{display:grid;gap:9px;margin:20px 0}.guide{display:block;padding:15px;border:1px solid var(--line);border-radius:14px;background:#201711;color:var(--cream);text-decoration:none}.guide strong{display:block}.guide small{display:block;color:var(--muted);margin-top:5px}.result-actions{display:grid;gap:10px}.result-actions .btn{text-decoration:none;display:flex;align-items:center;justify-content:center}.secondary{background:transparent;border:1px solid var(--line);color:var(--cream)}[hidden]{display:none!important}@media(max-width:390px){.shell{width:calc(100% - 24px);padding-top:14px}.panel{padding:20px 16px;border-radius:20px}.option{min-height:52px}.summary-row{grid-template-columns:88px 1fr}}
</style>
</head>
<body>
<main class="shell">
  <a class="brand" href="/">NIGHTON</a>
  <section class="panel" id="survey" aria-labelledby="questionTitle">
    <div class="progress-head"><span id="stepLabel">STEP 1 / 6</span><span id="stepCount">1/6</span></div>
    <div class="track" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1"><div class="bar" id="progressBar"></div></div>
    <div class="kicker">CONDITION CHECK</div>
    <h1 class="question" id="questionTitle"></h1>
    <div class="hint" id="questionHint"></div>
    <div class="options" id="options"></div>
    <div class="actions"><button class="btn back" id="backBtn" type="button">이전</button><button class="btn next" id="nextBtn" type="button">다음</button></div>
    <div class="error" id="error" role="alert"></div>
  </section>
  <section class="panel blocked" id="blocked" hidden>
    <div class="kicker">AGE CONFIRMATION</div><h1>이용할 수 없습니다.</h1>
    <p>본 서비스의 관련 정보와 상담은 성인만 이용할 수 있습니다. 이 확인은 법적 본인인증이 아닌 사용자 자기확인 절차입니다.</p>
    <a class="btn primary" href="/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">메인으로 돌아가기</a>
  </section>
  <section class="panel result" id="result" hidden>
    <div class="kicker">YOUR CONDITION</div><h1>선택하신 조건을 정리했어요.</h1><p>상담 전에 아래 정보를 먼저 확인해 보세요.</p>
    <div class="summary" id="summary"></div><div class="guides" id="guides"></div>
    <div class="result-actions"><a class="btn primary" id="chatCta" href="/?chat=1#chat-panel">익명 상담하기</a><a class="btn secondary" href="#guides">추천 정보 더 보기</a></div>
    <div class="error" id="resultError" role="alert"></div>
  </section>
</main>
<script>
const SUPABASE_URL='https://engfrvqbsqgqdywpmnjf.supabase.co';
const SUPABASE_KEY='sb_publishable_r3aqk4JW-kIBByl3x933_Q_XciIJ9Z3';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DRAFT_KEY='nighton_condition_draft_v1',TOKEN_KEY='nighton_survey_token';
const questions=[
 {key:'adult',title:'성인이신가요?',type:'single',options:[['yes','만 19세 이상입니다.'],['no','아닙니다.']]},
 {key:'region',title:'어느 지역을 알아보고 계신가요?',type:'single',options:[['sillim','신림'],['gangnam','강남'],['hongdae','홍대'],['geondae','건대'],['other','기타']]},
 {key:'experience',title:'관련 경험이 있으신가요?',type:'single',options:[['beginner','처음이에요'],['experienced','경험이 있어요'],['researching','아직 정보만 알아보는 중이에요']]},
 {key:'priorities',title:'가장 중요하게 생각하는 조건은 무엇인가요?',hint:'최대 3개까지 선택할 수 있어요.',type:'multi',max:3,options:[['income','수입'],['hours','근무시간'],['commute','출퇴근'],['environment','근무환경'],['safety','개인정보 / 안전'],['flexibility','자유로운 일정'],['unsure','아직 잘 모르겠어요']]},
 {key:'available_time',title:'주로 가능한 시간대는 언제인가요?',type:'single',options:[['evening','저녁부터 가능'],['late-night','늦은 밤 가능'],['discuss','시간 협의 필요'],['undecided','아직 정하지 않았어요']]},
 {key:'transport',title:'출퇴근에서 중요한 부분은 무엇인가요?',type:'single',options:[['ride-home','퇴근 이동수단'],['own-car','자차 이용'],['public-transit','대중교통'],['nearby','가까운 지역'],['none','특별히 상관없음']]}
];
const labels=Object.fromEntries(questions.flatMap(q=>q.options));
let state={step:0,answers:{}};
try{const saved=JSON.parse(localStorage.getItem(DRAFT_KEY));if(saved&&saved.answers)state={step:Math.min(saved.step||0,5),answers:saved.answers}}catch{}
function analytics(name,params={}){if(typeof window.gtag==='function')window.gtag('event',name,params)}
function saveDraft(){localStorage.setItem(DRAFT_KEY,JSON.stringify(state))}
function render(){const q=questions[state.step],value=state.answers[q.key];$('questionTitle').textContent=q.title;$('questionHint').textContent=q.hint||'';$('stepLabel').textContent=`STEP ${state.step+1} / ${questions.length}`;$('stepCount').textContent=`${state.step+1}/${questions.length}`;$('progressBar').style.width=`${(state.step+1)/questions.length*100}%`;document.querySelector('.track').setAttribute('aria-valuenow',state.step+1);$('backBtn').disabled=state.step===0;$('nextBtn').textContent=state.step===questions.length-1?'결과 보기':'다음';$('nextBtn').disabled=q.type==='multi'?!Array.isArray(value)||!value.length:!value;$('options').innerHTML=q.options.map(([v,l])=>`<button type="button" class="option" data-value="${v}" aria-pressed="${q.type==='multi'?(value||[]).includes(v):value===v}">${l}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(q,b.dataset.value));$('error').textContent=''}
function choose(q,value){if(q.key==='adult'&&value==='no'){state.answers.adult='no';saveDraft();$('survey').hidden=true;$('blocked').hidden=false;analytics('condition_check_step',{step:1,adult:false});return}if(q.type==='multi'){let arr=Array.isArray(state.answers[q.key])?[...state.answers[q.key]]:[];if(arr.includes(value))arr=arr.filter(v=>v!==value);else if(arr.length<q.max)arr.push(value);else{$('error').textContent=`최대 ${q.max}개까지 선택할 수 있습니다.`;return}state.answers[q.key]=arr}else state.answers[q.key]=value;saveDraft();render()}
async function complete(){const a=state.answers;if(a.adult!=='yes')return;setBusy(true);try{let visitorId=localStorage.getItem('nighton_visitor_id');if(!visitorId){visitorId='N-'+crypto.randomUUID().replace(/-/g,'').slice(0,8).toUpperCase();localStorage.setItem('nighton_visitor_id',visitorId)}let token=localStorage.getItem(TOKEN_KEY);if(!token){token=crypto.randomUUID();localStorage.setItem(TOKEN_KEY,token)}const {error}=await sb.rpc('upsert_nighton_consultation_profile',{p_visitor_id:visitorId,p_survey_token:token,p_adult_confirmed:true,p_region:a.region,p_experience:a.experience,p_priorities:a.priorities,p_available_time:a.available_time,p_transport_preference:a.transport,p_source:'condition-check'});if(error)throw error;state.step=5;saveDraft();showResult();analytics('condition_check_complete',{region:a.region,experience:a.experience,priority:(a.priorities||[])[0]||null})}catch(e){$('error').textContent='정보 저장 중 문제가 발생했습니다. 다시 시도해주세요.';console.warn(e)}finally{setBusy(false)}}
function showResult(){const a=state.answers;$('survey').hidden=true;$('result').hidden=false;$('summary').innerHTML=[['관심 지역',labels[a.region]],['경험',labels[a.experience]],['중요 조건',(a.priorities||[]).map(v=>labels[v]).join(' · ')],['가능 시간',labels[a.available_time]],['출퇴근',labels[a.transport]]].map(([k,v])=>`<div class="summary-row"><span>${k}</span><strong>${v||'-'}</strong></div>`).join('');const guides=[];if(a.experience==='beginner')guides.push(['/beginner-guide','초보자 가이드','처음 알아볼 때 확인할 내용을 정리했습니다.']);if(a.priorities?.includes('hours'))guides.push(['/work-hours','근무시간 안내','시간 협의 전에 확인할 내용을 살펴보세요.']);if(a.priorities?.includes('income'))guides.push(['/payment-guide','정산 방식 안내','정산 시점과 확인 항목을 안내합니다.']);if(a.priorities?.includes('safety'))guides.push(['/privacy','개인정보 안내','익명 상담과 개인정보 처리 범위를 확인하세요.']);if(!guides.length)guides.push(['/work-guide','근무 방식 안내','상담 전에 기본 업무 흐름을 확인하세요.']);$('guides').innerHTML=guides.map(([href,title,desc])=>`<a class="guide" href="${href}" data-guide="${title}"><strong>${title} →</strong><small>${desc}</small></a>`).join('');document.querySelectorAll('[data-guide]').forEach(a=>a.onclick=()=>analytics('guide_click_from_result',{guide:a.dataset.guide}));analytics('condition_result_view',{region:a.region,experience:a.experience})}
function setBusy(b){$('nextBtn').disabled=b;$('nextBtn').textContent=b?'저장 중...':'결과 보기'}
function $(id){return document.getElementById(id)}
$('nextBtn').onclick=()=>{const q=questions[state.step],v=state.answers[q.key];if(!v||(Array.isArray(v)&&!v.length))return;if(state.step<questions.length-1){state.step++;saveDraft();render();analytics('condition_check_step',{step:state.step+1})}else complete()};$('backBtn').onclick=()=>{if(state.step>0){state.step--;saveDraft();render()}};$('chatCta').onclick=()=>analytics('anonymous_chat_click',{region:state.answers.region,experience:state.answers.experience});
analytics('condition_check_start');if(Object.keys(state.answers).length===questions.length&&state.answers.adult==='yes')showResult();else render();
</script>
</body></html>
